name: MobileGL Plugin APK

on:
  push:
    branches:
      - dev
      - Feat/Backend-Direct-GLES
      - Feat/Backend-Direct-Vulkan
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set artifact metadata
        run: |
          echo "date_today=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.3.13750724"
          echo "ndk.dir=$ANDROID_HOME/ndk/27.3.13750724" >> android-plugin/local.properties

      - name: Update glslang external sources
        working-directory: 3rdparty/glslang
        run: python update_glslang_sources.py

      - name: Build plugin APK
        id: build
        run: |
          cd android-plugin
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Debug - List build outputs
        if: always()
        run: |
          echo "Current directory: $(pwd)"
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f
          echo "=== Checking expected path ==="
          ls -la android-plugin/app/build/outputs/apk/release/ 2>/dev/null || echo "Path not found"
          ls -la android-plugin/build/outputs/apk/release/ 2>/dev/null || echo "Alternative path not found"
          echo "=== Gradle build outputs ==="
          ls -la android-plugin/app/build/outputs/ 2>/dev/null || echo "No outputs directory"

      - name: Verify signed APK
        run: |
          # Find the APK file dynamically
          APK_FILE=$(find android-plugin -name "app-release.apk" -type f | head -n 1)
          
          if [ -z "$APK_FILE" ]; then
            echo "❌ Error: APK file not found!"
            echo "Build may have failed or APK path is different."
            exit 1
          fi
          
          echo "✅ Found APK at: $APK_FILE"
          
          # Find apksigner
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          
          if [ -z "$APKSIGNER" ]; then
            echo "❌ Error: apksigner not found!"
            exit 1
          fi
          
          echo "Using apksigner: $APKSIGNER"
          
          # Verify the APK
          "$APKSIGNER" verify --verbose "$APK_FILE"
          
          if [ $? -eq 0 ]; then
            echo "✅ APK verification successful!"
          else
            echo "❌ APK verification failed!"
            exit 1
          fi

      - name: Upload plugin APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileGL-plugin-${{ env.date_today }}-${{ env.short_sha }}
          path: android-plugin/**/app-release.apk
          if-no-files-found: error