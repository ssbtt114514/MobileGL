name: Build

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo+submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get CMake
        uses: lukka/get-cmake@latest

      - name: Prepare Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Update glslang external sources
        working-directory: ${{github.workspace}}/3rdparty/glslang
        run: python update_glslang_sources.py

      - name: Install clang-20, ninja, vulkan-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 clang++-20 lld-20 libc++-20-dev libc++abi-20-dev libvulkan-dev ninja-build

      - name: Show installed toolchain
        run: |
          clang-20 --version
          clang++-20 --version
          ninja --version
          ld.lld-20 --version || ld.lld --version || true

      - name: Configure (CMake)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20

      - name: Build
        run: |
          cmake --build build